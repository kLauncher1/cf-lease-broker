name: Release Standalone Artifacts

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Git Tag (e.g., v0.6.0)'
        required: false

jobs:
  build-and-publish:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build All Standalone Artifacts & Generate Checksums
        run: node scripts/build_artifacts.mjs --clean

      - name: Verify Cryptographic Checksums
        run: node scripts/build_artifacts.mjs --verify

      - name: Verify SHA-256 Checksums
        run: |
          cd dist
          sha256sum -c checksums.sha256

      - name: Upload Standalone Artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        with:
          files: |
            dist/cf-lease-broker-linux-amd64
            dist/cf-lease-broker-linux-arm64
            dist/cf-lease-broker-darwin-arm64
            dist/cf-lease-broker-windows-amd64.exe
            dist/checksums.sha256
            dist/checksums.txt
            dist/artifacts_manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
